<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 牢大 meme 风格头像 -->
  <!-- 光头圆脑袋 -->
  <circle cx="50" cy="45" r="32" fill="#6B3A2E" />
  <!-- 头顶高光 -->
  <ellipse cx="45" cy="28" rx="18" ry="10" fill="#8B5A4A" opacity="0.5" />
  <!-- 眉毛（愤怒挑眉） -->
  <line x1="32" y1="40" x2="45" y2="36" stroke="#2C1810" stroke-width="4" stroke-linecap="round" />
  <line x1="68" y1="40" x2="55" y2="36" stroke="#2C1810" stroke-width="4" stroke-linecap="round" />
  <!-- 眼睛 -->
  <circle cx="40" cy="47" r="5" fill="white" />
  <circle cx="60" cy="47" r="5" fill="white" />
  <circle cx="41" cy="47" r="3" fill="#1A0A05" />
  <circle cx="61" cy="47" r="3" fill="#1A0A05" />
  <!-- 嘴角上扬（牢大经典笑） -->
  <path d="M35 62 Q50 72 65 62" stroke="#2C1810" stroke-width="3" fill="none" stroke-linecap="round" />
  <!-- 胡茬 -->
  <circle cx="38" cy="30" r="1.5" fill="#4A2A1E" opacity="0.6"/>
  <circle cx="44" cy="28" r="1.5" fill="#4A2A1E" opacity="0.6"/>
  <circle cx="50" cy="27" r="1.5" fill="#4A2A1E" opacity="0.6"/>
  <circle cx="56" cy="28" r="1.5" fill="#4A2A1E" opacity="0.6"/>
  <circle cx="62" cy="30" r="1.5" fill="#4A2A1E" opacity="0.6"/>
  <!-- 左耳 -->
  <ellipse cx="18" cy="48" rx="7" ry="9" fill="#6B3A2E" />
  <!-- 右耳 -->
  <ellipse cx="82" cy="48" rx="7" ry="9" fill="#6B3A2E" />
</svg>
